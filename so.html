<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قيد التطوير</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            padding: 20px;
        }

        .message {
            color: #222222;
            font-size: 1.5rem;
            line-height: 1.9;
            text-align: center;
            max-width: 700px;
        }
    </style>
</head>
<body>
    <p class="message">
        هذه الميزة تحت التطوير، نأسف.<br>
        يمكنك التسجيل باستخدام جوجل فقط الآن.
    </p>
</body>
</html>
